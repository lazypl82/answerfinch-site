<main>
  <h1>Install Answerfinch</h1>
  <p><a id="marketplace-link" href="https://workspace.google.com/marketplace/app/answerfinch_form_notifications_email_rou/602427031339">Continue to Google Workspace Marketplace</a></p>
</main>
<script>
  const marketplaceLink = document.getElementById('marketplace-link');
  const marketplaceUrl = new URL(marketplaceLink.href);
  for (const [name, value] of new URLSearchParams(window.location.search)) {
    if (/^utm_[a-z0-9_]+$/.test(name)) marketplaceUrl.searchParams.append(name, value);
  }
  marketplaceLink.href = marketplaceUrl.href;

  let observer;
  function continueToMarketplace() {
    window.clearTimeout(deadline);
    observer?.disconnect();
    window.location.replace(marketplaceLink.href);
  }

  // Wait for the page-load beacon when available. Keep installation usable when analytics is blocked.
  const deadline = window.setTimeout(continueToMarketplace, 1500);
  if ('PerformanceObserver' in window) {
    try {
      observer = new PerformanceObserver((list) => {
        if (list.getEntries().some(({ name }) => /^https:\/\/cloudflareinsights\.com\/cdn-cgi\/rum\/?$/.test(name))) {
          continueToMarketplace();
        }
      });
      observer.observe({ type: 'resource', buffered: true });
    } catch {
      observer?.disconnect();
    }
  }
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "c19460813e6543029489f478b595bb10"}'></script>
